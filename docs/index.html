<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#204dc5">
  <title>استوديو عمر للمحتوى</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <aside class="sidebar">
      <div class="brandrow">
        <div class="brand">
          <span class="mark" id="brandIcon"></span>
          <div><strong>استوديو عمر</strong><small>مساحة المحتوى</small></div>
        </div>
        <button class="menuButton" id="menuButton" aria-expanded="false" aria-controls="nav">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>الأقسام
        </button>
      </div>
      <nav class="nav" id="nav" aria-label="أقسام الاستوديو"></nav>
      <div class="profile"><span class="avatar">ع ك</span><div><b>عمر كاشلان</b><small>تطوير البرمجيات</small></div></div>
    </aside>
    <main class="shell">
      <div class="bar">
        <span id="crumb"></span><span id="today"></span>
        <button id="syncIndicator" class="textbtn" onclick="goto('desk')" aria-label="حالة المزامنة وإعداداتها">الحفظ على الجهاز</button>
      </div>
      <section id="view" tabindex="-1"></section>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialogTitle">
    <div class="modalin">
      <header><h2 id="dialogTitle"></h2><button class="close" type="button" aria-label="إغلاق" onclick="dlg.close()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div id="form"></div>
    </div>
  </dialog>
  <div id="toast" role="status" class="toast hidden"></div>
  <script src="sync.js"></script>
  <script src="studio.js"></script>
  <script src="ui.js"></script>
</body>
</html>
